# Kritva Nexus application connectivity (KOS-NEXUS-007).
# Single machine-readable source of the master-to-memory connectivity: fabrics, masters, region attachments and links.
# Label: PROPOSED (NX-REQ-120); fabric widths and master placement are PROPOSED (NX-REQ-050, NX-REQ-051). The C910 route to the peripheral register space and the boot window bridge are SELECTED.
# Region names are those of application_map.yaml. A master has no path to a region that no link lists (default deny, NX-REQ-104).
# Attachment 'open' means the point where the region joins the fabrics is not defined (NX-ARCH-OI-040, NX-ARCH-OI-038).
