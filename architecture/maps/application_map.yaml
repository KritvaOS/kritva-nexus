# Kritva Nexus application address map (KOS-NEXUS-008, part 2).
# Single machine-readable source of the application address space.
# Label: SELECTED (NX-REQ-053, NX-DEC-030). The address width is SELECTED (NX-DEC-026, NX-REQ-101).
# Bases and apertures are proposals from A0 draft section 9.6; an aperture is not a capacity.
# Any address not listed is unmapped and returns DECERR (NX-REQ-079, NX-REQ-104).
# Access attributes follow NX-REQ-102 (SELECTED). A region label covers its base, aperture and attributes.
# Separate address space: the secure map is secure_map.yaml (NX-REQ-028, NX-REQ-108).
# Two controlled crossings exist (NX-DEC-027, NX-REQ-105): the security core reaches System SRAM through
# the boot window and the application reaches the mailbox window in the peripheral register space.
space: application
document: KOS-NEXUS-ADDRMAP-001
version: 0.3.2-draft
address_width_bits: 40
address_width_label: SELECTED
address_width_records: [NX-DEC-026, NX-REQ-101]
width_confirmation: SELECTED   # NX-REQ-029, NX-DEC-031; owner statement for the C910 and every application master
map_label: SELECTED
map_records: [NX-REQ-053, NX-REQ-102]
regions:
  - name: System SRAM
    base: 0x0000000000
    size: 0x0000100000
    class: system_sram
    cacheable: false
    perm: rwx
    label: SELECTED
    records: [NX-REQ-053, NX-REQ-102, NX-REQ-109]
    note: Capacity of the physical SRAM is not selected; the aperture is 1 MiB. Reachable by the security core through the boot window (NX-REQ-106), and by no other security path.
  - name: Camera frame pool
    base: 0x0010000000
    size: 0x0001000000
    class: local_sram
    cacheable: false
    perm: rw-
    label: SELECTED
    records: [NX-REQ-005, NX-REQ-047, NX-REQ-053, NX-REQ-102]
    note: Aperture 16 MiB; the usable capacity of 6 MiB is SELECTED (NX-REQ-005, NX-DEC-004).
  - name: ISP SRAM
    base: 0x0011000000
    size: 0x0001000000
    class: local_sram
    cacheable: false
    perm: rw-
    label: SELECTED
    records: [NX-REQ-047, NX-REQ-053, NX-REQ-102]
    note: Aperture 16 MiB, not a capacity.
  - name: NPU SRAM
    base: 0x0012000000
    size: 0x0002000000
    class: local_sram
    cacheable: false
    perm: rw-
    label: SELECTED
    records: [NX-REQ-047, NX-REQ-053, NX-REQ-102]
    note: Aperture 32 MiB, not a capacity.
  - name: Reserved
    base: 0x0014000000
    size: 0x000C000000
    class: reserved
    cacheable: false
    perm: "---"
    label: SELECTED
    records: [NX-REQ-053, NX-REQ-104]
    note: Treated as unmapped (DECERR).
  - name: Peripheral register space
    base: 0x0040000000
    size: 0x0010000000
    class: peripheral
    cacheable: false
    perm: rw-
    label: SELECTED
    records: [NX-REQ-053, NX-REQ-072, NX-REQ-102, NX-REQ-110]
    note: Divided into per-instance windows, including the DMA controller registers and the application-side mailbox window (NX-REQ-107), by peripheral_windows.yaml (NX-REQ-112, PROPOSED). The base and size of this region are unchanged.
  - name: OSPI NOR window
    base: 0x0060000000
    size: 0x0010000000
    class: nor
    cacheable: true
    perm: r-x
    label: SELECTED
    records: [NX-REQ-004, NX-REQ-053, NX-REQ-102, NX-REQ-111]
    note: Cacheable and read-only, program and erase only through the NOR controller registers (SELECTED, NX-REQ-111). Aperture 256 MiB; the NOR device and capacity are not selected (NX-ARCH-OI-006).
  - name: OSPI PSRAM
    base: 0x0070000000
    size: 0x0010000000
    class: psram
    cacheable: true
    perm: rwx
    label: SELECTED
    records: [NX-REQ-003, NX-REQ-053, NX-REQ-102]
    note: Aperture 256 MiB; the PSRAM capacity is not selected (NX-ARCH-OI-006).
  - name: DDR4
    base: 0x1000000000
    size: 0x1000000000
    class: ddr4
    cacheable: true
    perm: rwx
    label: SELECTED
    records: [NX-REQ-002, NX-REQ-053, NX-REQ-076, NX-REQ-102]
    note: Window of 64 GiB; it does not select a 64 GiB device. Capacity is chosen at board level.
