# Kritva Nexus secure address map (KOS-NEXUS-008, part 2).
# Single machine-readable source of the secure address space.
# Label: SELECTED (NX-REQ-054, NX-DEC-030); the secure address width is SELECTED (NX-REQ-033, NX-DEC-034). Bases come from A0 draft section 7.4; sizes come from this file.
# The secure space is separate from the application space: numerical overlap with
# application_map.yaml is not a conflict (NX-REQ-028, NX-REQ-033, NX-REQ-034).
# The boundary has exactly two controlled crossings (NX-DEC-027, NX-REQ-105): the Application boot window
# below and the Mailbox below; every other security resource is unreachable from the application space.
# Access attributes (cacheable, perm) are SELECTED (NX-REQ-119, NX-DEC-034); the base, size and label of a region are SELECTED (NX-REQ-054).
# Any address not listed is unmapped.
space: secure
document: KOS-NEXUS-ADDRMAP-002
version: 0.5.0-draft
address_width_bits: 32
address_width_label: SELECTED
address_width_records: [NX-REQ-033, NX-DEC-034]
attributes_label: SELECTED
attributes_records: [NX-REQ-119, NX-DEC-034]
map_label: SELECTED
map_records: [NX-REQ-054]
regions:
