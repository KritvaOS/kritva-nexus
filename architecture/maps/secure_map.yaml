# Kritva Nexus secure address map (KOS-NEXUS-008, part 2).
# Single machine-readable source of the secure address space.
# Label: PROPOSED (NX-REQ-054). Bases are proposals from A0 draft section 7.4; sizes are proposals of this file.
# The secure space is separate from the application space: numerical overlap with
# application_map.yaml is not a conflict (NX-REQ-028, NX-REQ-033, NX-REQ-034).
# The isolation boundary and the permitted access paths are OPEN (NX-ARCH-GAP-002).
# The access attributes of the secure space are not defined (NX-ARCH-OI-021).
# Any address not listed is unmapped.
space: secure
document: KOS-NEXUS-ADDRMAP-002
version: 0.1.0-draft
address_width_bits: 32
address_width_label: PROPOSED
address_width_records: [NX-REQ-033]
map_label: PROPOSED
map_records: [NX-REQ-054]
