    base: 0x00000000
    size: 0x00010000
    class: security_rom
    cacheable: false
    perm: r-x
    label: SELECTED
    records: [NX-REQ-010, NX-REQ-054]
    note: 64 KiB capacity is SELECTED (NX-REQ-010, NX-DEC-009); the base is proposed.
