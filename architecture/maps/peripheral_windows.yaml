    records: [NX-REQ-107, NX-REQ-110, NX-REQ-112]
    note: The only security-related window on the C910-to-APB path (NX-REQ-110); it gives no route to the secure map; register layout is OPEN (NX-ARCH-OI-037). The window size is an aperture.
  - name: ISP
    apb: APB-1
    base: 0x0041060000
    size: 0x0000010000
    class: media_ctrl
    label: SELECTED
    records: [NX-REQ-045, NX-REQ-112]
    note: ISP control registers. The window size is an aperture.
  - name: NPU
    apb: APB-1
    base: 0x0041070000
    size: 0x0000010000
    class: ai_ctrl
    label: SELECTED
    records: [NX-REQ-046, NX-REQ-112]
    note: NPU control registers. The window size is an aperture.
