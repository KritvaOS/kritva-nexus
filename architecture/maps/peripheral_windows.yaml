    class: nor_ctrl
    label: SELECTED
    records: [NX-REQ-004, NX-REQ-111, NX-REQ-112]
    note: Program and erase of the NOR device go only through these registers (NX-REQ-111). The window size is an aperture.
  - name: OSPI PSRAM controller
    apb: APB-1
    base: 0x0041020000
