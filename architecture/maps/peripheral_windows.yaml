    note: Storage DMA control registers. The window size is an aperture.
  - name: Application interrupt controller (PLIC)
    apb: APB-1
    base: 0x0041400000
    size: 0x0000400000
    class: interrupt_ctrl
    label: SELECTED
    records: [NX-REQ-057, NX-REQ-112, NX-REQ-116]
    note: PLIC with 128 external sources; the 4 MiB aperture covers the priority, pending, enable and per-context registers for the C910 contexts and is not a register count. The window size is an aperture.
  - name: Application timer and software interrupt (CLINT)
    apb: APB-1
    base: 0x0041800000
    size: 0x0000010000
    class: interrupt_ctrl
    label: SELECTED
    records: [NX-REQ-057, NX-REQ-112, NX-REQ-116]
    note: CLINT for the C910 timer and software interrupts. The window size is an aperture.
