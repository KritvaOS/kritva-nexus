    records: [NX-REQ-026, NX-REQ-112]
    note: I2S master instance 0 of two. The window size is an aperture.
  - name: I2S1
    apb: APB-0
    base: 0x00400E0000
    size: 0x0000010000
    class: i2s
    label: SELECTED
    records: [NX-REQ-026, NX-REQ-112]
    note: I2S master instance 1 of two. The window size is an aperture.
  - name: DMA controller
    apb: APB-1
    base: 0x0041000000
    size: 0x0000010000
    class: dma
    label: SELECTED
    records: [NX-REQ-092, NX-REQ-093, NX-REQ-112]
    note: Registers of the 32-channel DMA controller; the descriptor format and request mapping are OPEN (NX-ARCH-OI-035). The window size is an aperture.
  - name: OSPI NOR controller
    apb: APB-1
