# Kritva Nexus application peripheral register windows (KOS-NEXUS-008, NX-ARCH-OI-036).
# Machine-readable division of the application map region "Peripheral register space" (application_map.yaml)
# into the two AXI-to-APB windows and one 64 KiB window per peripheral instance or control block.
# Label: SELECTED (NX-REQ-112, NX-DEC-033). The parent region and its base and size are SELECTED (NX-REQ-053, NX-DEC-030).
# APB-0 holds the peripherals of NX-REQ-019 to NX-REQ-026; APB-1 holds control and block registers.
# A window size is an aperture, not a register count. Any address in the parent region that no window lists
# is unmapped and returns DECERR (NX-REQ-104). The PLIC and CLINT windows follow the application
# interrupt controller baseline (NX-REQ-116, SELECTED); the security and always-on controllers stay OPEN (NX-REQ-057).
space: application_peripheral
document: KOS-NEXUS-ADDRMAP-003
version: 0.3.0-draft
parent_region: Peripheral register space
map_label: SELECTED
map_records: [NX-REQ-112]
apb_windows:
  - name: APB-0
    base: 0x0040000000
    size: 0x0001000000
    label: SELECTED
    records: [NX-REQ-016, NX-REQ-112]
    note: AXI-to-APB interconnect 0, peripherals; the 16 MiB aperture is an aperture, not a size of registers.
  - name: APB-1
    base: 0x0041000000
    size: 0x0001000000
    label: SELECTED
    records: [NX-REQ-016, NX-REQ-112]
    note: AXI-to-APB interconnect 1, control and block registers; the 16 MiB aperture is an aperture, not a size of registers.
windows:
  - name: PWM controller
    apb: APB-0
    base: 0x0040000000
    size: 0x0000010000
    class: pwm
    label: SELECTED
    records: [NX-REQ-019, NX-REQ-112]
    note: 16 PWM channels in one block. The window size is an aperture.
  - name: GPIO controller
    apb: APB-0
    base: 0x0040010000
    size: 0x0000010000
    class: gpio
    label: SELECTED
    records: [NX-REQ-020, NX-REQ-112]
    note: 32 GPIOs in one block. The window size is an aperture.
  - name: General-purpose timers
    apb: APB-0
    base: 0x0040020000
    size: 0x0000010000
    class: timer
    label: SELECTED
    records: [NX-REQ-021, NX-REQ-112]
    note: Four timers in one block. The window size is an aperture.
  - name: UART0
    apb: APB-0
    base: 0x0040030000
    size: 0x0000010000
    class: uart
    label: SELECTED
    records: [NX-REQ-022, NX-REQ-112]
    note: UART instance 0 of four. The window size is an aperture.
  - name: UART1
    apb: APB-0
    base: 0x0040040000
    size: 0x0000010000
    class: uart
    label: SELECTED
    records: [NX-REQ-022, NX-REQ-112]
    note: UART instance 1 of four. The window size is an aperture.
  - name: UART2
    apb: APB-0
    base: 0x0040050000
    size: 0x0000010000
    class: uart
    label: SELECTED
    records: [NX-REQ-022, NX-REQ-112]
    note: UART instance 2 of four. The window size is an aperture.
  - name: UART3
    apb: APB-0
    base: 0x0040060000
    size: 0x0000010000
    class: uart
    label: SELECTED
    records: [NX-REQ-022, NX-REQ-112]
    note: UART instance 3 of four. The window size is an aperture.
  - name: I2C0
    apb: APB-0
    base: 0x0040070000
    size: 0x0000010000
    class: i2c
    label: SELECTED
    records: [NX-REQ-023, NX-REQ-112]
    note: I2C master instance 0 of four. The window size is an aperture.
  - name: I2C1
    apb: APB-0
    base: 0x0040080000
    size: 0x0000010000
    class: i2c
    label: SELECTED
    records: [NX-REQ-023, NX-REQ-112]
    note: I2C master instance 1 of four. The window size is an aperture.
  - name: I2C2
