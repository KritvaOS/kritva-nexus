    records: [NX-REQ-024, NX-REQ-112]
    note: One SPI master. The window size is an aperture.
  - name: SPI slave
    apb: APB-0
    base: 0x00400C0000
    size: 0x0000010000
    class: spi
    label: SELECTED
    records: [NX-REQ-025, NX-REQ-112]
    note: One SPI slave. The window size is an aperture.
  - name: I2S0
