    base: 0x0040090000
    size: 0x0000010000
    class: i2c
    label: SELECTED
    records: [NX-REQ-023, NX-REQ-112]
    note: I2C master instance 2 of four. The window size is an aperture.
  - name: I2C3
    apb: APB-0
    base: 0x00400A0000
    size: 0x0000010000
    class: i2c
    label: SELECTED
    records: [NX-REQ-023, NX-REQ-112]
    note: I2C master instance 3 of four. The window size is an aperture.
  - name: SPI master
