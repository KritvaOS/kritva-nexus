    class: psram_ctrl
    label: SELECTED
    records: [NX-REQ-003, NX-REQ-112]
    note: PSRAM controller registers; protocol and mode are OPEN (NX-ARCH-OI-006). The window size is an aperture.
  - name: DDR4 controller
    apb: APB-1
    base: 0x0041030000
    size: 0x0000010000
    class: ddr_ctrl
    label: SELECTED
    records: [NX-REQ-002, NX-REQ-112]
    note: DDR4 controller and PHY registers; the controller is not selected. The window size is an aperture.
  - name: Clock, reset and power control
    apb: APB-1
    base: 0x0041040000
    size: 0x0000010000
    class: sysctl
    label: SELECTED
    records: [NX-REQ-058, NX-REQ-060, NX-REQ-061, NX-REQ-112]
