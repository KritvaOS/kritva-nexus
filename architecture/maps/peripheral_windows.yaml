  - name: Display controller
    apb: APB-1
    base: 0x0041090000
    size: 0x0000010000
    class: media_ctrl
    label: SELECTED
    records: [NX-REQ-006, NX-REQ-112]
    note: Display and compositor control registers. The window size is an aperture.
  - name: Ethernet MAC0
    apb: APB-1
    base: 0x00410A0000
    size: 0x0000010000
    class: eth_ctrl
    label: SELECTED
    records: [NX-REQ-008, NX-REQ-112]
