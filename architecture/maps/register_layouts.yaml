# Kritva Nexus register layouts (KOS-NEXUS-008, part 4).
# Single machine-readable source of the register conventions and of the registers of each block class.
# Label: PROPOSED (NX-REQ-117, NX-REQ-118). The mailbox layouts follow MEMORY_ARCHITECTURE 5.5 and are SELECTED (NX-REQ-114, NX-DEC-033).
# Field-level definitions are not proposed here: they depend on IP selection and block specifications (NX-ARCH-OI-039).
# A register listed here is one 32-bit word at a 4-byte aligned offset inside its block window; an offset that is not listed returns SLVERR.
space: register_layouts
document: KOS-NEXUS-REGMAP-001
version: 0.1.0-draft
layout_label: PROPOSED
layout_records: [NX-REQ-117, NX-REQ-118]
register_width_bits: 32
header_size: 0x100
common_registers:
  - name: ID
    offset: 0x000
    access: RO
    note: Block identifier
  - name: VERSION
    offset: 0x004
    access: RO
    note: Block version
  - name: CONTROL
    offset: 0x008
    access: RW
    note: Bit 0 enable, bit 1 soft reset (self-clearing); other bits are block specific
  - name: STATUS
    offset: 0x00C
    access: RO
    note: Bit 0 busy, bit 1 error; other bits are block specific
  - name: INT_ENABLE
    offset: 0x010
    access: RW
    note: One enable bit per interrupt cause of the block
  - name: INT_STATUS
    offset: 0x014
    access: W1C
    note: One status bit per interrupt cause of the block; write 1 to clear
layouts:
  - name: pwm
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Pulse-width modulation; the channel count is not defined.
  - name: gpio
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: General-purpose input and output; the pin count is not defined.
  - name: timer
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: General-purpose timers; the timer count is not defined.
  - name: uart
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Serial port; the FIFO depth and the flow-control signals are not defined.
  - name: i2c
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Two-wire bus controller; the roles supported are not defined.
  - name: spi
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Serial peripheral interface; master and slave use this layout.
  - name: i2s
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Audio serial interface.
  - name: dma
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: General-purpose DMA controller with 32 channels (NX-REQ-092); addresses are 40 bits, as two words.
  - name: nor_ctrl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: OSPI NOR controller; program and erase go only through these registers (NX-REQ-111).
  - name: psram_ctrl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: OSPI PSRAM controller.
  - name: ddr_ctrl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: DDR4 controller; the register set of the controller IP is not selected.
  - name: sysctl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Clock, reset and power control, including the DVFS of the C910 and the NPU (NX-REQ-017, NX-REQ-018).
  - name: media_ctrl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Buffer-based stream block (ISP, camera, display, storage DMA); the frame format list is not defined.
  - name: ai_ctrl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: NPU control; the command format is not defined.
  - name: eth_ctrl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Ethernet MAC; the PHY interface and the descriptor format are not defined.
  - name: plic
    header: false
    label: PROPOSED
    records: [NX-REQ-116]
    note: Standard RISC-V PLIC layout with 128 sources; whether the C910 PLIC matches it is not confirmed (NX-ARCH-OI-001).
  - name: clint
    header: false
    label: PROPOSED
    records: [NX-REQ-116]
    note: Standard RISC-V CLINT layout; whether the C910 CLINT matches it is not confirmed (NX-ARCH-OI-001).
  - name: mailbox_app
    header: false
    label: SELECTED
    records: [NX-REQ-114]
    note: Application-side view of the mailbox, as in MEMORY_ARCHITECTURE 5.5; registers the application may not access are not listed and return SLVERR.
  - name: mailbox_sec
    header: false
    label: SELECTED
    records: [NX-REQ-114]
    note: Security-side view of the mailbox, as in MEMORY_ARCHITECTURE 5.5; registers the security domain may not access are not listed and return SLVERR.
  - name: aes
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: AES block; the modes and key sizes are not defined. Keys are never readable.
  - name: sha
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: SHA-256 block.
  - name: pka
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Asymmetric accelerator; the algorithms are not defined (NX-REQ-035), so only the frame is proposed.
  - name: efuse
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: eFuse macro access; the provisioning scheme is not defined.
  - name: keymgmt
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Key management; the key hierarchy is not defined.
  - name: secctrl
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Security control; the debug lifecycle is not defined (NX-ARCH-OI-020).
  - name: sectimer
    header: true
    label: PROPOSED
    records: [NX-REQ-118]
    note: Security timer and watchdog.
