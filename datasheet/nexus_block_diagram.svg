<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Helvetica, Arial, sans-serif" font-size="10" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Kritva Nexus block diagram, preliminary</title><desc id="d">Block diagram of the planned Kritva Nexus SoC: masters, four AXI fabrics, Memory Access Crossbar, memory controllers, AXI fabric bridge and APB peripherals, security domain, and always-on, clock, reset and power. Labels S, P and O give the requirements-register label of each block. Preliminary planning diagram, not a product specification.</desc>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="380" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Kritva Nexus block diagram (PRELIMINARY PLANNING DIAGRAM, NOT A PRODUCT SPECIFICATION)</text>
<g fill="#111827">
<rect x="10" y="30" width="110" height="52" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="65.0" y="53.2" text-anchor="middle" font-weight="700">C910 CPU cluster</text><text x="65.0" y="65.8" text-anchor="middle">RV64, 4 cores [P]</text>
<rect x="130" y="30" width="110" height="52" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="185.0" y="53.2" text-anchor="middle" font-weight="700">NPU [P]</text><text x="185.0" y="65.8" text-anchor="middle">4 clusters</text>
<rect x="250" y="30" width="120" height="52" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="310.0" y="53.2" text-anchor="middle" font-weight="700">Cameras and ISP [P]</text><text x="310.0" y="65.8" text-anchor="middle">4 cameras</text>
<rect x="380" y="30" width="110" height="52" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="2.2"/><text x="435.0" y="53.2" text-anchor="middle" font-weight="700">Display [S]</text><text x="435.0" y="65.8" text-anchor="middle">720p60, 3 layers</text>
<rect x="500" y="30" width="120" height="52" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="2.2"/><text x="560.0" y="53.2" text-anchor="middle" font-weight="700">2 Ethernet MACs [S]</text><text x="560.0" y="65.8" text-anchor="middle">RGMII, EtherCAT [P]</text>
<rect x="630" y="30" width="120" height="52" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="690.0" y="53.2" text-anchor="middle" font-weight="700">DMA masters [P]</text><text x="690.0" y="65.8" text-anchor="middle">peripheral, storage</text>
<rect x="10" y="112" width="110" height="34" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="65.0" y="132.5" text-anchor="middle" font-weight="700">AXI-0 128-bit [P]</text>
<rect x="130" y="112" width="240" height="34" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="250.0" y="132.5" text-anchor="middle" font-weight="700">AXI-1 256-bit [P]  (AI and vision)</text>
<rect x="380" y="112" width="240" height="34" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="500.0" y="132.5" text-anchor="middle" font-weight="700">AXI-2 128-bit [P]  (multimedia, IO)</text>
<rect x="630" y="112" width="120" height="34" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="6 3"/><text x="690.0" y="132.5" text-anchor="middle" font-weight="700">AXI-3 64-bit [P]</text>
